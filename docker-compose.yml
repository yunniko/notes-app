# Database and API. Ports bind to 127.0.0.1 only.
# Ports bind to 127.0.0.1 only. Credentials below are local-development defaults;
# override them in a .env file (see .env.example).
name: notes-app

services:
  db:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: ${DB_NAME:-notes}
      MARIADB_USER: ${DB_USER:-notes}
      MARIADB_PASSWORD: ${DB_PASSWORD:-notes}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ./backend
      target: prod
    environment: &db-env
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-notes}
      DB_USER: ${DB_USER:-notes}
      DB_PASSWORD: ${DB_PASSWORD:-notes}
      APP_DEBUG: ${APP_DEBUG:-0}
    depends_on:
      db:
        condition: service_healthy

  # Backend checks (formatting, static analysis, unit + integration tests) against an
  # isolated test database:  docker compose --profile dev run --rm api-dev
  api-dev:
    profiles: [dev]
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
    environment:
      <<: *db-env
      DB_NAME: notes_test
      APP_DEBUG: 1
    command: sh -c "composer install --no-interaction --no-progress && composer check"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
